[project]
name = "example_project"
version = "0.1"
authors = [{ name = 'David A. Minton', email = 'daminton@purdue.edu' }]
maintainers = [{ name = 'David A. Minton', email = 'daminton@purdue.edu' }]

readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]


[project.optional-dependencies]
tests = ["pytest"]


[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"